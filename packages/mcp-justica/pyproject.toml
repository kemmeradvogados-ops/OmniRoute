[project]
name = "justica-mcp"
version = "0.1.0"
description = "Camada padronizadora de acesso processual (somente leitura) para os tribunais da Kemmer Advogados"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
justica-mcp = "justica_mcp.server:main"
justica-diagnostico = "justica_mcp.diagnostico:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
justica_mcp = ["dados/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
